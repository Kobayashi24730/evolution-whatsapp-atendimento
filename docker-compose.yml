services:
  evolution_db:
    image: postgres:15-alpine
    restart: always
    container_name: evolution_db
    networks:
      - nex_networks
    environment:
      POSTGRES_USER: ${POSTGRES_USER_ADMIN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ADMIN}
      POSTGRES_DB: evolution_automation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guilherme_admin -d evolution_automation"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution_client:
    image: postgres:15-alpine
    restart: always
    container_name: evolution_client
    networks:
      - nex_networks
    environment:
      POSTGRES_USER: ${guilherme_client}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CLIENT}
      POSTGRES_DB: evolution_client
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U guilherme_client -d evolution_client" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_client:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:latest
    container_name: evolution_redis
    restart: always
    networks:
      - nex_networks
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    networks:
      - nex_networks
    environment:
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://atendimento_next:3000/api/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      SERVER_URL: ${EVOLUTION_API_URL}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${DATABASE_URL}

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PORT: "6379"
      CACHE_REDIS_DB: "0"
      CACHE_REDIS_URI: ${WEBHOOK_URL}

      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
    depends_on:
      evolution_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nextjs:
    build:
      context: ./client
    env_file:
      - ./client/.env
    container_name: atendimento_next
    networks:
      - nex_networks
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - WATCHPACK_POLLING=true
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - WEBHOOK_URL=${WEBHOOK_URL}
    command: npm run dev
    depends_on:
      evolution_client:
        condition: service_healthy
      evolution:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_data_client:
  redis_data:

networks:
  nex_networks:
    driver: bridge
    name: nex_networks